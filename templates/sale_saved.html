{% extends "base.html" %}
{% block title %}Transaction Saved — ALSONDOS{% endblock %}

{% block extra_css %}
<style>
.ss-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 15, 35, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1050;
  backdrop-filter: blur(2px);
}
.ss-popup {
  background: #fff;
  border-radius: 14px;
  width: 460px;
  max-width: 94vw;
  box-shadow: 0 20px 60px rgba(0,0,0,.28);
  overflow: hidden;
  animation: ssIn .22s ease;
}
@keyframes ssIn {
  from { opacity:0; transform: translateY(-18px) scale(.97); }
  to   { opacity:1; transform: translateY(0)    scale(1);    }
}
.ss-header {
  background: linear-gradient(135deg, var(--navy-dk) 0%, #1a3a6b 100%);
  padding: 24px 28px 20px;
  text-align: center;
  color: #fff;
}
.ss-check {
  width: 52px; height: 52px;
  background: rgba(255,255,255,.12);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
  font-size: 22px;
}
.ss-txn {
  font-family: ui-monospace, monospace;
  font-size: 19px;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 4px;
}
.ss-meta {
  font-size: 12.5px;
  opacity: .72;
  line-height: 1.6;
}
.ss-body {
  padding: 24px 28px 28px;
  text-align: center;
}
.ss-question {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy-dk);
  margin-bottom: 6px;
}
.ss-sub {
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 22px;
  line-height: 1.5;
}
.ss-supplier {
  display: inline-block;
  background: var(--navy-lt);
  color: var(--navy-dk);
  font-weight: 700;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 20px;
  border: 1px solid rgba(13,32,64,.12);
}
.ss-actions {
  display: flex;
  gap: 10px;
}
.ss-actions .btn {
  flex: 1;
  padding: 12px;
  font-size: 14px;
  font-weight: 700;
}
.ss-no-email {
  background: var(--orange-lt, #fff4e6);
  border: 1px solid rgba(230,126,34,.2);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--orange, #e67e22);
  margin-bottom: 18px;
  text-align: left;
}
</style>
{% endblock %}

{% block content %}
{# Empty page — the popup is the only UI #}
{% endblock %}

{% block extra_js %}
<script>
var _mailtoUrl = {{ mailto_url|tojson }};
var _skipUrl   = {{ url_for('sales_report')|tojson }};

function ssSend() {
  if (_mailtoUrl) {
    window.location.href = _mailtoUrl;
    setTimeout(function(){ window.location.href = _skipUrl; }, 1500);
  } else {
    window.location.href = _skipUrl;
  }
}

function ssSkip() {
  window.location.href = _skipUrl;
}

// Render popup after base layout loads
document.addEventListener('DOMContentLoaded', function() {
  var overlay = document.createElement('div');
  overlay.className = 'ss-overlay';
  overlay.innerHTML = `
    <div class="ss-popup">
      <div class="ss-header">
        <div class="ss-check"><i class="fas fa-check"></i></div>
        <div class="ss-txn">{{ txn_number }}</div>
        <div class="ss-meta">
          {{ sale.customer }}{% if sale.from_loc and sale.to_loc %} &nbsp;·&nbsp; {{ sale.from_loc }} → {{ sale.to_loc }}{% endif %}{% if sale.travel_date %}<br>{{ sale.travel_date }}{% endif %}
        </div>
      </div>
      <div class="ss-body">
        <div class="ss-question">Transaction saved successfully.</div>
        <div class="ss-sub">Would you like to send a booking email to the supplier?</div>
        {% if supplier_name %}
        <div class="ss-supplier"><i class="fas fa-handshake" style="font-size:10px;margin-right:5px"></i>{{ supplier_name }}</div>
        {% endif %}
        {% if not email_data.to %}
        <div class="ss-no-email">
          <i class="fas fa-info-circle"></i>
          No email address configured for <strong>{{ supplier_name or 'this supplier' }}</strong>.
          <a href="{{ url_for('master_suppliers') }}" style="color:var(--orange);font-weight:700">Set it up →</a>
        </div>
        {% endif %}
        <div class="ss-actions">
          <button class="btn btn-red" onclick="ssSend()" {% if not email_data.to %}disabled title="No supplier email configured"{% endif %}>
            <i class="fas fa-paper-plane"></i> Send Email
          </button>
          <button class="btn btn-outline" onclick="ssSkip()">Skip</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
});
</script>
{% endblock %}
